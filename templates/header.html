<header class="topbar">
    <a class="brand" href="{% url 'home' %}">Hotel System</a>
    <nav class="nav">
        <a href="{% url 'home' %}">Кімнати</a>
        {% if user.is_authenticated %}
            <a href="{% url 'my_bookings' %}">Мої бронювання</a>
            <span class="nav-user">Привіт, {{ user.username }}</span>
            <form class="nav-form" action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit">Вийти</button>
            </form>
        {% else %}
            <a href="{% url 'register' %}">Реєстрація</a>
            <a href="{% url 'login' %}">Увійти</a>
        {% endif %}
    </nav>
</header>
